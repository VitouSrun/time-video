<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f4f4f4;
    }
    #startPip {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      background: #007aff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
	#pipVideo{
		padding: 10px
	}
  </style>
</head>
<body>
  <canvas id="myCanvas" width="300" height="200" style="display:none;"></canvas>
  <video id="pipVideo" autoplay muted playsinline></video>
  <button id="startPip">PiP</button>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("pipVideo");
    const pipBtn = document.getElementById("startPip");

    let counter = 0;

    // Draw custom UI continuously
    function drawUI() {
       ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Centered text
      ctx.fillStyle = "#000000";
      ctx.font = "45px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.fillText(new Date().toLocaleTimeString(), centerX, centerY);

      requestAnimationFrame(drawUI);
    }

    drawUI();

    // Stream canvas to video
    const stream = canvas.captureStream(30); // 30fps
    video.srcObject = stream;

    pipBtn.addEventListener("click", async () => {
      if (document.pictureInPictureEnabled) {
        try {
          await video.requestPictureInPicture();
        } catch (err) {
          console.error("PiP failed:", err);
          alert("PiP not supported on this browser.");
        }
      } else {
        alert("Picture-in-Picture is not supported.");
      }
    });
  </script>
</body>
</html>
